<!-- src/app/compartido/componentes/sidebar/sidebar.html -->
<nav class="sidebar">
  <!-- Brand -->
  <div class="sidebar-brand">
    <div class="logo-container">
      <img src="assets/logo.png" alt="Connectopia" />
    </div>
    <div class="brand-text">
      <h2>Connectopia</h2>
      <span>Tu comunidad</span>
    </div>
  </div>

  <!-- Navegación -->
  <div class="sidebar-nav">
    <ng-container *ngFor="let item of menuItems">
      <!-- Con submenú -->
      <ng-container *ngIf="item.children && item.children.length > 0">
        <div class="nav-item has-submenu" (click)="toggleSubmenu(item)">
          <i [class]="item.icon"></i>
          <span>{{ item.label }}</span>
          <i class="chevron" [class.open]="item.expanded">▾</i>
        </div>
        <div class="submenu" [class.open]="item.expanded">
          <a
            *ngFor="let child of item.children"
            class="nav-item"
            [routerLink]="child.route"
            routerLinkActive="active"
          >
            <i [class]="child.icon"></i>
            <span>{{ child.label }}</span>
          </a>
        </div>
      </ng-container>

      <!-- Sin submenú -->
      <a
        *ngIf="!item.children"
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
      >
        <i [class]="item.icon"></i>
        <span>{{ item.label }}</span>
        <span *ngIf="item.badge" class="badge">{{ item.badge }}</span>
      </a>
    </ng-container>
  </div>

  <!-- Footer con usuario -->
  <div class="sidebar-footer">
    <div class="user-profile" (click)="goToProfile()">
      <div class="user-avatar">
        <img *ngIf="user?.avatar_url" [src]="user.avatar_url" alt="Avatar" />
        <span *ngIf="!user?.avatar_url">{{ getIniciales() }}</span>  <!-- ✅ Ahora funciona -->
      </div>
      <div class="user-info">
        <strong>{{ user?.name || 'Usuario' }}</strong>
        <span>{{ user?.role || 'Invitado' }}</span>
      </div>
    </div>
    <button class="logout-btn" (click)="logout()">
      <i class="bi-box-arrow-right"></i> Cerrar sesión
    </button>
  </div>
</nav>
