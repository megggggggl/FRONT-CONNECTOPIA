<nav class="sidebar">
  <div class="sidebar-brand">
    <div class="logo-container">
      <img *ngIf="!logoError" src="/logo.png" alt="Logo de Connectopia" (error)="ocultarLogo()">
      <i *ngIf="logoError" class="fa-solid fa-people-roof" aria-hidden="true"></i>
    </div>
    <div class="brand-text"><h2>Connectopia</h2><span>Tu comunidad conectada</span></div>
  </div>

  <span class="nav-label">Navegación</span>
  <div class="sidebar-nav">
    <ng-container *ngFor="let item of menuItems">
      <ng-container *ngIf="item.children && item.children.length > 0">
        <button type="button" class="nav-item has-submenu" (click)="toggleSubmenu(item)" [attr.aria-expanded]="item.expanded">
          <i [class]="item.icon" aria-hidden="true"></i><span>{{ item.label }}</span><i class="fa-solid fa-chevron-down chevron" [class.open]="item.expanded" aria-hidden="true"></i>
        </button>
        <div class="submenu" [class.open]="item.expanded">
          <a *ngFor="let child of item.children" class="nav-item" [routerLink]="child.route" routerLinkActive="active"><i [class]="child.icon" aria-hidden="true"></i><span>{{ child.label }}</span></a>
        </div>
      </ng-container>
      <a *ngIf="!item.children" class="nav-item" [routerLink]="item.route" routerLinkActive="active"><i [class]="item.icon" aria-hidden="true"></i><span>{{ item.label }}</span><span *ngIf="item.badge" class="badge">{{ item.badge }}</span></a>
    </ng-container>
  </div>

  <div class="sidebar-footer">
    <div class="user-profile" (click)="goToProfile()">
      <div class="user-avatar"><img *ngIf="user?.avatar_url && !avatarError" [src]="user.avatar_url" alt="Avatar del usuario" (error)="ocultarAvatar()"><span *ngIf="!user?.avatar_url || avatarError">{{ getIniciales() }}</span></div>
      <div class="user-info"><strong>{{ user?.name || 'Usuario' }}</strong><span>{{ user?.role || 'Invitado' }}</span></div>
    </div>
    <button type="button" class="logout-btn" (click)="logout()"><i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i><span>Cerrar sesión</span></button>
  </div>
</nav>
