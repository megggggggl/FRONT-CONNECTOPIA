<aside class="toast-stack" aria-live="polite"><article *ngFor="let toast of feedback.toasts()" class="toast" [class]="'toast ' + toast.kind"><i [class]="toast.kind === 'success' ? 'fa-solid fa-circle-check' : toast.kind === 'error' ? 'fa-solid fa-circle-exclamation' : 'fa-solid fa-circle-info'"></i><span>{{ toast.message }}</span><button type="button" (click)="feedback.dismissToast(toast.id)" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button></article></aside>
<div class="dialog-backdrop" *ngIf="feedback.dialog() as dialog"><section class="feedback-dialog" role="dialog" aria-modal="true"><span class="dialog-icon" [class.danger]="dialog.danger"><i [class]="dialog.danger ? 'fa-solid fa-triangle-exclamation' : 'fa-solid fa-circle-question'"></i></span><h2>{{ dialog.title }}</h2><p>{{ dialog.message }}</p><label *ngIf="dialog.input">{{ dialog.inputLabel || 'Detalle' }}<textarea rows="3" [ngModel]="dialog.inputValue" (ngModelChange)="feedback.updateInput($event)" [placeholder]="dialog.inputPlaceholder || ''"></textarea></label><footer><button type="button" class="secondary" (click)="feedback.resolve(dialog.input ? null : false)">{{ dialog.cancelText }}</button><button type="button" class="primary" [class.danger]="dialog.danger" (click)="confirmar()">{{ dialog.confirmText }}</button></footer></section></div>
