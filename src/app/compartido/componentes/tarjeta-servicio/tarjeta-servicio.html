<!-- src/app/compartido/componentes/tarjeta-servicio/tarjeta-servicio.html -->
<article class="tarjeta-servicio">
  <div class="imagen-servicio-contenedor">
    <img
      *ngIf="servicio.images?.length"
      [src]="servicio.images[0]"
      [alt]="servicio.name"
      class="imagen-servicio"
    />
    <div *ngIf="!servicio.images?.length" class="imagen-servicio-vacia"></div>
    <span class="estado-servicio" [ngClass]="obtenerClaseEstado()">
      {{ servicio.status }}
    </span>
  </div>

  <div class="contenido-servicio">
    <p class="categoria-servicio">Servicio</p>
    <h3 class="titulo-servicio">{{ servicio.name }}</h3>
    <p class="descripcion-servicio">
      {{ servicio.description || 'Sin descripción disponible.' }}
    </p>
    <p class="precio-servicio">
      {{ servicio.price ? ('L ' + servicio.price) : 'Precio a consultar' }}
    </p>

    <div class="metricas-servicio">
      <div class="metrica">
        <span>{{ servicio.avg_rating || 0 }} ⭐</span>
      </div>
      <div class="metrica">
        <span>{{ servicio.reviews_count || 0 }} reseñas</span>
      </div>
    </div>

    <div class="acciones-servicio">
      <!-- Corazón Favorito -->
      <button class="btn-favorito" (click)="toggleFavoritoEvent()">
        {{ esFavorito ? '❤️' : '🤍' }}
      </button>

      <!-- Solicitar cita -->
      <button
        *ngIf="mostrarAccionCita"
        class="boton-telegram"
        [disabled]="solicitandoCita"
        (click)="emitirSolicitudCita()"
      >
        <span>TG</span> {{ solicitandoCita ? 'Abriendo...' : 'Solicitar cita' }}
      </button>

      <!-- Calificar -->
      <button
        *ngIf="mostrarCalificar"
        class="btn-calificar"
        (click)="calificar.emit(servicio.id)"
      >
        ⭐ Calificar
      </button>
    </div>
  </div>
</article>
