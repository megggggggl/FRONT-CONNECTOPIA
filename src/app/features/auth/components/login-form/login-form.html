<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mini-form">
  <div *ngIf="successMessage" class="login-message success">
    {{ successMessage }}
  </div>

  <div *ngIf="errorMessage" class="login-message error">
    {{ errorMessage }}
  </div>

  <div class="form-group">
    <input
      type="email"
      formControlName="email"
      placeholder="Correo electronico"
      [class.error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
      required
    />
    <small *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-text">
      <span *ngIf="loginForm.get('email')?.errors?.['required']">El correo es requerido</span>
      <span *ngIf="loginForm.get('email')?.errors?.['email']">Ingrese un correo valido</span>
    </small>
  </div>

  <div class="form-group">
    <div class="password-wrapper">
      <input
        [type]="showPassword ? 'text' : 'password'"
        formControlName="password"
        placeholder="Contrasena"
        [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        required
      />
      <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
        {{ showPassword ? 'Ocultar' : 'Ver' }}
      </button>
    </div>
    <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-text">
      <span *ngIf="loginForm.get('password')?.errors?.['required']">La contrasena es requerida</span>
      <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Minimo 6 caracteres</span>
    </small>
  </div>

  <button
    type="submit"
    [disabled]="isLoading || loginForm.invalid"
    class="login-button"
  >
    <span *ngIf="!isLoading">Iniciar sesion</span>
    <span *ngIf="isLoading" class="spinner">Cargando...</span>
  </button>
</form>
