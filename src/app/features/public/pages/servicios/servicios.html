<!-- src/app/features/public/pages/servicios/servicios.html -->
<div class="servicios-page">
  <div class="page-header">
    <h1>Servicios disponibles</h1>
    <p>Encuentra profesionales y servicios cerca de ti</p>
  </div>

  <!-- Filtros -->
  <div class="filtros">
    <div class="filtro-busqueda">
      <input
        type="text"
        [(ngModel)]="searchTerm"
        (input)="onSearch()"
        placeholder="Buscar servicios..."
        class="input-busqueda"
      />
    </div>

    <div class="filtro-categoria">
      <select
        [(ngModel)]="filtroCategoria"
        (change)="onCategoryChange()"
        class="select-categoria"
      >
        <option value="">Todas las categorías</option>
        <option *ngFor="let cat of categorias" [value]="cat.id">
          {{ cat.name }}
        </option>
      </select>
    </div>

    <div class="filtro-orden">
      <select
        [(ngModel)]="ordenPor"
        (change)="onOrderChange()"
        class="select-orden"
      >
        <option value="reciente">Más recientes</option>
        <option value="nombre">Por nombre</option>
        <option value="popular">Más populares</option>
      </select>
    </div>

    <div class="filtro-especial">
      <select
        [(ngModel)]="filtroEspecial"
        (change)="onFiltroEspecialChange()"
        class="select-especial"
      >
        <option value="todos">Todos</option>
        <option value="cercanos">Cercanos</option>
        <option value="frecuentes">Mis frecuentes</option>
      </select>
    </div>

    <button class="btn-limpiar" (click)="limpiarFiltros()">
      Limpiar filtros
    </button>
  </div>

  <!-- Mensajes ubicación -->
  <div *ngIf="filtroEspecial === 'cercanos' && !ubicacion && !cargandoUbicacion" class="sin-ubicacion">
    <p>⚠️ Activa tu ubicación para ver servicios cercanos.</p>
    <button class="btn-limpiar" (click)="obtenerUbicacion()">Intentar de nuevo</button>
  </div>
  <div *ngIf="cargandoUbicacion" class="cargando-ubicacion">
    <span>📍 Obteniendo ubicación...</span>
  </div>

  <!-- Estado -->
  <div *ngIf="loading" class="loading">Cargando servicios...</div>
  <div *ngIf="error && !loading" class="error">{{ error }}</div>

  <!-- Lista -->
  <div *ngIf="!loading && !error">
    <div *ngIf="serviciosFiltrados.length === 0" class="sin-resultados">
      <p>No hay servicios que coincidan con los filtros.</p>
      <button class="btn-limpiar" (click)="limpiarFiltros()">Limpiar filtros</button>
    </div>

    <div class="grid-servicios" *ngIf="serviciosFiltrados.length > 0">
      <app-tarjeta-servicio
        *ngFor="let servicio of serviciosFiltrados"
        [servicio]="servicio"
        [mostrarAccionCita]="true"
        [solicitandoCita]="solicitandoMap[servicio.id] || false"
        [esFavorito]="favoritosIds.has(servicio.id)"
        [mostrarCalificar]="puedeCalificar(servicio.id)"
        (toggleFavorito)="onToggleFavorito($event)"
        (solicitarCita)="onSolicitarCita(servicio)"
        (calificar)="abrirModalCalificacion(servicio.id)"
      >
      </app-tarjeta-servicio>
    </div>
  </div>

  <!-- ========================================================== -->
  <!-- MODALES -->
  <!-- ========================================================== -->


  <app-calificar-servicio-modal
    *ngIf="modalCalificacionAbierto && servicioParaCalificarId"
    [servicioId]="servicioParaCalificarId"
    (cerrar)="cerrarModalCalificacion()"
    (calificado)="cerrarModalCalificacion()"
  ></app-calificar-servicio-modal>
</div>
