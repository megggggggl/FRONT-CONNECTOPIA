<!-- src/app/features/public/pages/mapa/mapa.component.html -->
<div class="mapa-page">
  <h1>🗺️ Mapa interactivo</h1>
  <p>Explora eventos, servicios, lugares turísticos, denuncias y paradas de bus en tu comunidad.</p>

  <!-- Filtros -->
  <div class="filtros-mapa">
    <label *ngFor="let tipo of tiposFiltro">
      <input type="checkbox" [(ngModel)]="tipo.checked" (change)="actualizarMapa()" />
      {{ tipo.icon }} {{ tipo.label }}
    </label>
    <button class="btn-ubicacion" (click)="irMiUbicacion()">📍 Mi ubicación</button>
  </div>

  <!-- Contenedor del mapa -->
  <div id="map" style="height: 600px; border-radius: 16px; width: 100%;"></div>

  <!-- Leyenda -->
  <div class="leyenda">
    <span *ngFor="let item of colores">
      <span class="color-dot" [style.background]="item.color"></span> {{ item.label }}
    </span>
  </div>
</div>
