<section class="mapa-page"><header><div class="title"><span><i class="fa-solid fa-map-location-dot"></i></span><div><small>Explora tu entorno</small><h1>Mapa interactivo</h1><p>Eventos, servicios, lugares, denuncias y transporte en una sola vista.</p></div></div><button class="btn-ubicacion" (click)="irMiUbicacion()"><i class="fa-solid fa-location-crosshairs"></i>Mi ubicación</button></header><section class="filtros-mapa"><span class="filter-label">Mostrar en el mapa</span><label *ngFor="let tipo of tiposFiltro" [class.checked]="tipo.checked"><input type="checkbox" [(ngModel)]="tipo.checked" (change)="actualizarMapa()"><i [class]="tipo.icon"></i>{{ tipo.label }}</label></section><div class="map-shell"><div id="map"></div><aside class="leyenda"><strong>Leyenda</strong><span *ngFor="let item of colores"><i class="color-dot" [style.background]="item.color"></i>{{ item.label }}</span></aside></div></section>
