<div class="perfil-container">
  <!-- Encabezado -->
  <app-encabezado-perfil
    [perfil]="perfil"
    (editar)="abrirModalEditar()"
  ></app-encabezado-perfil>

  <!-- Estado de carga / error -->
  <div *ngIf="cargando" class="loading-state">
    <div class="spinner"></div>
    <p>Cargando tu perfil...</p>
  </div>
  <div *ngIf="error && !cargando" class="error-state">
    <p>{{ error }}</p>
    <button (click)="recargarPerfil()">Reintentar</button>
  </div>

  <!-- Contenido del perfil -->
  <div *ngIf="!cargando && !error" class="perfil-content">
    
    <!-- Estadísticas -->
    <div class="estadisticas-grid">
      <app-tarjeta-estadistica
        icono="📝"
        titulo="Publicaciones"
        [valor]="publicaciones"
        (click)="irPublicaciones()"
        class="estadistica-card"
      ></app-tarjeta-estadistica>

      <app-tarjeta-estadistica
        icono="🚨"
        titulo="Denuncias"
        [valor]="denuncias"
        (click)="irDenuncias()"
        class="estadistica-card"
      ></app-tarjeta-estadistica>

      <app-tarjeta-estadistica
        icono="❤️"
        titulo="Favoritos"
        [valor]="favoritos"
        (click)="irFavoritos()"
        class="estadistica-card"
      ></app-tarjeta-estadistica>

      <app-tarjeta-estadistica
        icono="📅"
        titulo="Eventos"
        [valor]="eventos"
        (click)="irEventos()"
        class="estadistica-card"
      ></app-tarjeta-estadistica>

      <app-tarjeta-estadistica
        icono="📋"
        titulo="Servicios solicitados"
        [valor]="serviciosSolicitados"
        (click)="irMisCitas()"
        class="estadistica-card"
      ></app-tarjeta-estadistica>

      <app-tarjeta-estadistica
        icono="⭐"
        titulo="resenas recibidas"
        [valor]="resenasRecibidas"
        class="estadistica-card"
      ></app-tarjeta-estadistica>

      <app-tarjeta-estadistica
        icono="✍️"
        titulo="resenas escritas"
        [valor]="resenasEscritas"
        class="estadistica-card"
      ></app-tarjeta-estadistica>

      <app-tarjeta-estadistica
        icono="💬"
        titulo="Comentarios"
        [valor]="comentarios"
        class="estadistica-card"
      ></app-tarjeta-estadistica>
    </div>

    <!-- Servicios Destacados (solo si es prestador) -->
    <div *ngIf="serviciosDestacados.length > 0" class="seccion-destacados">
      <h3>🏆 Servicios mejor valorados</h3>
      <div class="servicios-destacados">
        <div *ngFor="let s of serviciosDestacados" class="servicio-destacado">
          <div class="info">
            <h4>{{ s.name }}</h4>
            <p>⭐ {{ s.avg_rating | number:'1.1' }}</p>
            <small>{{ s.reviews_count || 0 }} resenas</small>
          </div>
        </div>
      </div>
    </div>

    <!-- resenas Recientes -->
    <div *ngIf="resenasRecientes.length > 0" class="seccion-resenas">
      <h3>📝 resenas recientes</h3>
      <div class="resenas-lista">
        <div *ngFor="let r of resenasRecientes" class="resena-item">
          <div class="resena-header">
            <span class="estrellas">{{ '⭐'.repeat(r.rating) }}</span>
            <span class="fecha">{{ r.created_at | date:'dd/MM/yyyy' }}</span>
          </div>
          <p>{{ r.comment || 'Sin comentario' }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
