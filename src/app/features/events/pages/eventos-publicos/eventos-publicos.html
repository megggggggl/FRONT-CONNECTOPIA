<div class="eventos-publicos">
  <div class="page-header">
    <h1>Eventos comunitarios</h1>
    <p>Descubre y participa en actividades de tu comunidad</p>
  </div>

  <!-- Debug (opcional) -->
  <div style="background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 8px; font-size: 12px;">
    <strong>Debug:</strong> loading={{ loading }}, error='{{ error }}', eventos.length={{ eventos.length }}
  </div>

  <div *ngIf="loading" class="loading">Cargando eventos...</div>
  <div *ngIf="error && !loading" class="error">{{ error }}</div>

  <div *ngIf="!loading && !error">
    <div *ngIf="eventos.length === 0" class="empty">
      <p>No hay eventos disponibles en este momento.</p>
    </div>

    <div class="grid-eventos" *ngIf="eventos.length > 0">
 <app-tarjeta-evento
  *ngFor="let evento of eventos"
  [evento]="evento"
  [estaInscrito]="estaInscrito(evento.id)"
  [registrandose]="false"
  [cancelandoRegistro]="false"
  [esAdmin]="isAdmin"
  [eliminando]="false"
  (registrarse)="registrarseEvento($event)"
  (cancelarRegistro)="cancelarRegistroEvento($event)"
  (eliminarEvento)="eliminarEvento($event)"
>
</app-tarjeta-evento>
    </div>
  </div>
</div>
