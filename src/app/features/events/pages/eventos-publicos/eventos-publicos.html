<section class="eventos-publicos"><header class="page-header"><div><span>Agenda comunitaria</span><h1>Eventos que nos conectan</h1><p>Descubre actividades, encuentros y experiencias cerca de ti.</p></div><i class="fa-solid fa-calendar-days"></i></header><div *ngIf="loading" class="skeleton-grid"><article *ngFor="let item of [1,2,3,4]"><i></i><span></span><span></span></article></div><div *ngIf="error && !loading" class="state error"><i class="fa-solid fa-cloud-arrow-down"></i><h2>No pudimos cargar los eventos</h2><p>{{ error }}</p></div><div *ngIf="!loading && !error"><div *ngIf="eventos.length === 0" class="state"><i class="fa-regular fa-calendar-xmark"></i><h2>No hay eventos disponibles</h2><p>Las próximas actividades de la comunidad aparecerán aquí.</p></div><header class="results" *ngIf="eventos.length"><span>Próximas actividades</span><strong>{{ eventos.length }} evento(s)</strong></header><div class="grid-eventos"><app-tarjeta-evento *ngFor="let evento of eventos" [evento]="evento" [estaInscrito]="estaInscrito(evento.id)" [registrandose]="false" [cancelandoRegistro]="false" [esAdmin]="isAdmin" [eliminando]="false" (registrarse)="registrarseEvento($event)" (cancelarRegistro)="cancelarRegistroEvento($event)" (eliminarEvento)="eliminarEvento($event)"></app-tarjeta-evento></div></div></section>
