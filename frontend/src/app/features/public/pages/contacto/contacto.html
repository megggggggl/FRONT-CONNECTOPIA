<app-main-layout>
  <section class="contacto-page">
    <h1>Contacto</h1>
    <p>¿Tienes preguntas, sugerencias o necesitas ayuda? Escríbenos.</p>
    <form (ngSubmit)="enviarMensaje()">
      <div class="form-group">
        <label>Nombre completo</label>
        <input type="text" [(ngModel)]="nombre" name="nombre" placeholder="Tu nombre" required />
      </div>
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="tu@email.com" required />
      </div>
      <div class="form-group">
        <label>Mensaje</label>
        <textarea [(ngModel)]="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
      </div>
      <button type="submit">Enviar mensaje</button>
    </form>
  </section>
</app-main-layout>
