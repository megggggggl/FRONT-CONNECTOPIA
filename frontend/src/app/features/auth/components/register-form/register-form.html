<form (ngSubmit)="register()" class="mini-form" #registerForm="ngForm">
  <div *ngIf="exito" class="login-message success">{{ exito }}</div>
  <div *ngIf="error" class="login-message error">{{ error }}</div>

  <div class="form-group">
    <input type="text" [(ngModel)]="name" name="name" placeholder="Nombre completo *" required />
  </div>

  <div class="form-group">
    <input type="email" [(ngModel)]="email" name="email" placeholder="Correo electronico *" required />
  </div>

  <div class="field-row">
    <div class="form-group">
      <input type="text" [(ngModel)]="phone" name="phone" placeholder="Telefono" />
    </div>

    <div class="form-group">
      <input type="date" [(ngModel)]="fechaNacimiento" name="fechaNacimiento" />
    </div>
  </div>

  <div class="form-group">
    <input type="text" [(ngModel)]="idDocumentNumber" name="idDocumentNumber" placeholder="Documento opcional" />
  </div>

  <div class="form-group">
    <select [(ngModel)]="role" name="role" class="form-select">
      <option value="vecino">Vecino</option>
      <option value="prestador">Prestador de servicios</option>
    </select>
  </div>

  <div class="form-group">
    <div class="password-wrapper">
      <input
        [type]="showPassword ? 'text' : 'password'"
        [(ngModel)]="password"
        name="password"
        placeholder="Contrasena *"
        required
        minlength="6"
      />
      <button type="button" class="toggle-password" (click)="showPassword = !showPassword">
        {{ showPassword ? 'Ocultar' : 'Ver' }}
      </button>
    </div>
  </div>

  <div class="form-group">
    <div class="password-wrapper">
      <input
        [type]="showConfirmPassword ? 'text' : 'password'"
        [(ngModel)]="confirmPassword"
        name="confirmPassword"
        placeholder="Confirmar contrasena *"
        required
        minlength="6"
      />
      <button type="button" class="toggle-password" (click)="showConfirmPassword = !showConfirmPassword">
        {{ showConfirmPassword ? 'Ocultar' : 'Ver' }}
      </button>
    </div>
  </div>

  <button type="submit" [disabled]="cargando || !registerForm.valid" class="login-button">
    <span *ngIf="!cargando">Registrarse</span>
    <span *ngIf="cargando" class="spinner">Registrando...</span>
  </button>

  <!-- NUEVO: Enlace para invitado -->
  <p class="form-footer">
    <a href="/explorar" class="link">Ingresa como invitado</a>
  </p>

</form>
